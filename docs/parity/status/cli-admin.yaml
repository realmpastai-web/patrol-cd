    - internal/cli/admin/backup_test.go:TestImportGivesAnUnchangedSecretItsOwner
    - internal/cli/admin/backup_test.go:TestImportGivesAnUnchangedApplicationItsOwner
    - internal/cli/admin/backup_test.go:TestImportUpdatesASecretOnlyTheBackupReferences
    - internal/cli/admin/backup_test.go:TestImportNeverWritesAnInstallationSecretABackupReferences
    - internal/cli/admin/backup_test.go:TestImportClusterCheckRefusesOnlyAMovedCluster
    - internal/cli/admin/backup_test.go:TestImportHidesCredentialsInServers
    - internal/cli/admin/backup_test.go:TestImportDeletedClusterComesBackAndTheOtherIsKept
    - internal/cli/admin/backup_test.go:TestImportRefusesALiveClusterSwitchedToAHeldSecret
    - internal/cli/admin/backup_test.go:TestImportRestoresASecretOnceItsClusterIsPruned
    - internal/cli/admin/backup_test.go:TestImportKeepsTheSecretOfAClusterThePromptKeeps
    - internal/cli/admin/backup_test.go:TestImportRestoresASecretALiveClusterMovesOff
    - internal/cli/admin/backup_test.go:TestImportPrunesASecretALiveClusterMovesOff
    - internal/cli/admin/backup_test.go:TestImportKeepsASecretAClusterOfTheBackupReads
    - internal/cli/admin/backup_test.go:TestImportDoesNotPruneAnUnmanagedSecretOnlyTheBackupReferences
    - internal/cli/admin/backup_test.go:TestImportDoesNotOfferTheSecretOfAClusterThePromptKeeps
    - internal/cli/admin/backup_test.go:TestImportKeepsTheSecretOfAClusterItMayNotDelete
    - internal/cli/admin/backup_test.go:TestImportListsEveryCrossedCluster
    - internal/cli/admin/backup_test.go:TestImportKeepsASecretAPrunedClusterShares
    - internal/cli/admin/backup_test.go:TestImportKeepsTheOwnersTheBackupDoesNotName
    - internal/cli/admin/backup_test.go:TestImportReplacesAnOwnerAtAnOldUID
    - internal/cli/admin/backup_test.go:TestImportStopsAtASecretOnlyABackupRepositoryReferences
    - internal/cli/admin/backup_test.go:TestImportRestoresATLSSecretALiveClusterReferences
  evidence: docs/verification/log.md#V-0060
  notes: >-
    Differs from upstream on a backup that moves a live Cluster: upstream's one Secret moves server
    and credentials together, while Patrol's spec.server is immutable, so the import refuses before
    writing and --keep-live-clusters keeps the live Cluster and its Secret. A Cluster skipped by
    --skip-resources-with-label is not refused and keeps the Secret it references, as upstream's
    label covers both, whether or not the backup holds that Cluster. A live Cluster the backup does
    not hold keeps that Secret too until --prune removes that Cluster. --prune comes after every
    write, so the next import restores a Secret of the backup whose Cluster is gone, and a Secret the
    backup does not hold can be pruned with its Cluster. A backup that would start a Cluster reading
    a Secret held this way, or one it has no copy of or skips, is refused too if a live Cluster reads
    that Secret at a server the backup does not use it for. An import gives an object the owners the
    backup names, which upstream's update does not, and keeps the others, because two Cluster objects
    can own one Secret here.

