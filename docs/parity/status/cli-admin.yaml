    - internal/cli/admin/backup_test.go:TestImportSkippedMovedClusterKeepsItsSecret
    - internal/cli/admin/backup_test.go:TestImportSkippedClusterKeepsItsSecretAtTheSameServer
    - internal/cli/admin/backup_test.go:TestImportSkippedLiveClusterKeepsItsSecret
